<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Piano táctil multitáctil para el móvil">
  <title>Piano</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="group">
      <button id="octDown" class="btn" aria-label="Bajar octava">◀</button>
      <span id="rangeLabel" class="label">Do3 – Do5</span>
      <button id="octUp" class="btn" aria-label="Subir octava">▶</button>
    </div>
    <div class="group">
      <button id="zoomOut" class="btn" aria-label="Más teclas">−</button>
      <span class="label small">Teclas</span>
      <button id="zoomIn" class="btn" aria-label="Menos teclas">+</button>
    </div>
    <div class="group">
      <button id="sustain" class="btn toggle" aria-pressed="false">Sustain</button>
      <button id="haptics" class="btn toggle" aria-pressed="false">Vibrar</button>
    </div>
    <div class="group">
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">
      <button id="fullscreen" class="btn" aria-label="Pantalla completa">⛶</button>
    </div>
  </header>

  <main id="keyboard" class="keyboard" aria-label="Teclado de piano"></main>

  <div id="rotate" class="rotate">
    <div>⟳</div>
    <p>Gira el móvil en horizontal</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
